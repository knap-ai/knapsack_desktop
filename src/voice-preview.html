<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Knapsack voice QA preview</title></head>
  <body style="margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <div class="ClawdChatMain" style="height:100vh">
      <section class="ClawdVoiceSession" aria-label="Voice conversation">
        <div class="ClawdVoiceSessionTop">
          <div class="ClawdVoiceSessionContext"><strong>Scout</strong><span>Your conversation continues here.</span></div>
          <button type="button" aria-label="Close voice conversation">×</button>
        </div>
        <div class="ClawdVoiceSessionCenter">
          <div class="ClawdVoiceMark listening" aria-hidden="true"><img src="/assets/images/knap-logo-medium.png" alt="" /></div>
          <h2>Listening</h2>
          <p>Speak naturally. Pause to send, or tap Done.</p>
        </div>
        <div class="ClawdVoiceSessionControls">
          <button type="button" aria-label="Switch to typing">✎ <span>Type</span></button>
          <button type="button" class="ClawdVoiceSessionMic recording" aria-label="Done speaking">■</button>
          <button type="button" aria-label="Mute spoken replies">◖)) <span>Sound on</span></button>
        </div>
      </section>
    </div>
    <script type="module">import './src/components/organisms/ClawdChat/style.scss'</script>
  </body>
</html>
