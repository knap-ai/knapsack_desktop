name: Gateway Regression Guards

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/gateway-regression.yml"
      - "src/scripts/**"
      - "src/package.json"
      - "src/package-lock.json"
      - "src/src-tauri/resources/clawdbot/npm-shrinkwrap.json"
      - "src/src-tauri/Cargo.toml"
      - "src/src-tauri/Cargo.lock"
      - "src/src-tauri/src/clawd/**"
      - "src/src/hooks/useFollowThrough.ts"
      - "src/src/api/followThrough.ts"
      - "src/src/components/organisms/GBrainView/FollowThroughPanel.tsx"
      - "src/src-tauri/src/llm/use_cases/**"
      - "src/src-tauri/src/audio/**"
      - "src/src-tauri/src/main.rs"
      - "src/src-tauri/src/spotlight.rs"
      - "src/src-tauri/src/server/actix.rs"
      - "src/src/App.tsx"
      - "src/src/api/recording.tsx"
      - "src/src/hooks/feed/useFeed.tsx"
      - "src/src/components/molecules/RecordingIndicator/**"
      - "src/src/components/organisms/MeetingNotesMode/**"
      - "src/src-tauri/resources/clawdbot/**"
  push:
    branches: [main, "release/*"]
    paths:
      - ".github/workflows/gateway-regression.yml"
      - "src/scripts/**"
      - "src/package.json"
      - "src/package-lock.json"
      - "src/src-tauri/resources/clawdbot/npm-shrinkwrap.json"
      - "src/src-tauri/Cargo.toml"
      - "src/src-tauri/Cargo.lock"
      - "src/src-tauri/src/clawd/**"
      - "src/src/hooks/useFollowThrough.ts"
      - "src/src/api/followThrough.ts"
      - "src/src/components/organisms/GBrainView/FollowThroughPanel.tsx"
      - "src/src-tauri/src/llm/use_cases/**"
      - "src/src-tauri/src/audio/**"
      - "src/src-tauri/src/main.rs"
      - "src/src-tauri/src/spotlight.rs"
      - "src/src-tauri/src/server/actix.rs"
      - "src/src/App.tsx"
      - "src/src/api/recording.tsx"
      - "src/src/hooks/feed/useFeed.tsx"
      - "src/src/components/molecules/RecordingIndicator/**"
      - "src/src/components/organisms/MeetingNotesMode/**"
      - "src/src-tauri/resources/clawdbot/**"
  workflow_dispatch:

concurrency:
  group: gateway-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clawdbot-bundle-integrity:
    name: Clawdbot bundle integrity
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/src-tauri/resources/clawdbot/npm-shrinkwrap.json

      - name: Install clawdbot dependencies
        working-directory: src/src-tauri/resources/clawdbot
        run: npm ci --ignore-scripts

      - name: Install bundled plugin runtime deps
        working-directory: src
        run: node scripts/install-bundled-plugin-deps.cjs

      - name: Test commitment follow-through reminders
        working-directory: src
        run: node --test scripts/follow-through.test.cjs

      - name: Test provider model compatibility and failover
        working-directory: src
        run: |
          npm run test:model-catalogs
          node --test scripts/scout-provider-failover.test.mjs

      - name: Test direct document fetch recovery
        working-directory: src
        run: node --test scripts/web-fetch-recovery.test.mjs

      - name: Test browser-control placeholder handoff
        working-directory: src
        run: node --test scripts/browser-placeholder-handoff.test.cjs

      - name: Test session permissions and native Gmail QA evidence
        working-directory: src
        run: node --test scripts/session-permission-fence.test.cjs scripts/qa-native-gmail-evidence.test.cjs

      - name: Test recording lifecycle and controls
        working-directory: src
        run: node --test scripts/agent-scheduled-runs.test.cjs scripts/recording-indicator-state.test.cjs scripts/meeting-recording-routing.test.cjs scripts/audio-capture-readiness.test.cjs

      - name: Report clawdbot duplicates before prune
        working-directory: src
        run: node scripts/report-clawdbot-duplicates.cjs

      - name: Smoke-test gateway live timing
        working-directory: src
        run: node scripts/smoke-test-gateway-live.cjs

      - name: Prepare bundled Node.js
        working-directory: src
        run: node scripts/prepare-node.cjs

      - name: Prune clawdbot bundle
        working-directory: src
        run: node scripts/prune-clawdbot.cjs

      - name: Verify clawdbot bundle integrity
        working-directory: src
        run: node scripts/verify-clawdbot-bundle.cjs

      - name: Enforce clawdbot duplicate gate
        working-directory: src
        run: node scripts/report-clawdbot-duplicates.cjs --enforce

  rust-gateway-regressions:
    name: Rust gateway regressions
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src/src-tauri
          cache-bin: false

      - name: Create Tauri dist directory
        working-directory: src
        run: mkdir -p dist

      - name: Run gateway service tests
        working-directory: src
        env:
          VITE_KN_API_SERVER: https://api.knapsack.ai
          VITE_GOOGLE_CLIENT_ID: "963137762742-tqs7tiv9bkh80t5io8hm5q8e798ab85s.apps.googleusercontent.com"
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml clawd::service -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml clawd::follow_through -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml audio::audio::tests -- --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml audio::transcribe::tests -- --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml local_speech::tests -- --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml audio::permission::resource_tests -- --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml utils::runtime::tests -- --test-threads=1
          cargo test --manifest-path src-tauri/Cargo.toml llm::use_cases::gemini_oauth -- --nocapture
