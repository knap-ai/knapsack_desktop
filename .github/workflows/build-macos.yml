name: Build macOS App (Universal)

on:
  push:
    branches: [main, "release/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable with targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src/src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install npm dependencies
        working-directory: src
        run: npm install

      - name: Create .env from example
        working-directory: src
        run: cp .env.example .env

      - name: Install clawdbot dependencies
        working-directory: src/src-tauri/resources/clawdbot
        run: npm ci --ignore-scripts

      - name: Install bundled plugin runtime deps
        working-directory: src
        run: node scripts/install-bundled-plugin-deps.cjs

      - name: Report clawdbot duplicates before prune
        working-directory: src
        run: node scripts/report-clawdbot-duplicates.cjs

      - name: Smoke-test gateway plugin registration
        working-directory: src
        run: bash scripts/smoke-test-gateway-plugins.sh

      - name: Smoke-test gateway live timing
        working-directory: src
        run: node scripts/smoke-test-gateway-live.cjs

      - name: Run prebuild scripts
        working-directory: src
        env:
          UNIVERSAL_BUILD: "true"
        run: |
          node scripts/sync-version.cjs
          node scripts/prepare-node.cjs
          node scripts/prune-clawdbot.cjs

      - name: Verify clawdbot bundle integrity
        working-directory: src
        run: node scripts/verify-clawdbot-bundle.cjs

      - name: Enforce clawdbot duplicate gate
        working-directory: src
        run: node scripts/report-clawdbot-duplicates.cjs --enforce

      - name: Build Tauri app (universal)
        working-directory: src
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm exec -- tauri build --target universal-apple-darwin --bundles app updater --ci
          else
            npm exec -- tauri build --target universal-apple-darwin --ci
          fi
        env:
          VITE_KN_API_SERVER: https://api.knapsack.ai
          MICROSOFT_CLIENT_ID: unused
          VITE_GOOGLE_CLIENT_ID: "963137762742-tqs7tiv9bkh80t5io8hm5q8e798ab85s.apps.googleusercontent.com"
          VITE_GOOGLE_DEVELOPER_KEY: ""
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Verify app bundle code signature
        working-directory: src
        run: |
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/Knapsack.app
          RESULT=$(codesign --verify --deep --strict "$APP" 2>&1 || true)
          # An unsigned build is fine (signing requires Apple certs).
          # A *broken seal* ("sealed resource is missing or invalid") must fail the build.
          if echo "$RESULT" | grep -q "a sealed resource is missing or invalid"; then
            echo "ERROR: App bundle seal is broken — files were modified after signing:"
            echo "$RESULT"
            exit 1
          fi
          echo "Bundle integrity check: OK"

      - name: Verify updater artifact integrity after extraction
        working-directory: src
        run: |
          TARBALL=$(ls src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz 2>/dev/null | head -1)
          if [ -z "$TARBALL" ]; then
            echo "No updater tarball found — skipping extraction integrity check"
            exit 0
          fi
          EXTRACT_DIR=$(mktemp -d)
          tar -xzf "$TARBALL" -C "$EXTRACT_DIR"
          EXTRACTED_APP=$(find "$EXTRACT_DIR" -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$EXTRACTED_APP" ]; then
            echo "ERROR: No .app found after extracting updater tarball"
            rm -rf "$EXTRACT_DIR"
            exit 1
          fi
          RESULT=$(codesign --verify --deep --strict "$EXTRACTED_APP" 2>&1 || true)
          if echo "$RESULT" | grep -q "a sealed resource is missing or invalid"; then
            echo "ERROR: Updater tarball breaks the app bundle seal after extraction:"
            echo "$RESULT"
            rm -rf "$EXTRACT_DIR"
            exit 1
          fi
          echo "Updater extraction integrity check: OK"
          rm -rf "$EXTRACT_DIR"

      - name: Upload DMG artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: knapsack-macos-dmg
          path: src/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Upload updater artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: knapsack-macos-updater
          path: |
            src/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: warn

      - name: Upload updater artifact (best effort for pull requests)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: knapsack-macos-updater
          path: |
            src/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: warn
