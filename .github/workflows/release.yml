name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Bump version, commit, and tag
  # ---------------------------------------------------------------------------
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Bump version
        id: bump
        working-directory: src
        run: node scripts/bump-version.cjs

      - name: Commit and tag
        run: |
          TAG="${{ steps.bump.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main --tags
          git add -A
          if git diff --cached --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "release: $TAG"
          fi
          git rebase origin/main
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "ERROR: tag $TAG already exists on origin; refusing to reuse it for a new release commit."
            exit 1
          fi
          git push origin HEAD:main
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

  # ---------------------------------------------------------------------------
  # macOS — Universal binary (arm64 + x86_64), signed & notarized
  # ---------------------------------------------------------------------------
  build-macos:
    needs: bump-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump-version.outputs.tag }}

      - name: Install Rust stable with targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src/src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install npm dependencies
        working-directory: src
        run: npm install

      - name: Create .env from example
        working-directory: src
        run: cp .env.example .env

      - name: Install clawdbot dependencies
        working-directory: src/src-tauri/resources/clawdbot
        run: npm ci --ignore-scripts

      - name: Install bundled plugin runtime deps
        working-directory: src
        run: node scripts/install-bundled-plugin-deps.cjs

      - name: Report clawdbot duplicates before prune
        working-directory: src
        run: node scripts/report-clawdbot-duplicates.cjs

      - name: Smoke-test gateway plugin registration
        working-directory: src
        run: bash scripts/smoke-test-gateway-plugins.sh

      - name: Smoke-test gateway live timing
        working-directory: src
        run: node scripts/smoke-test-gateway-live.cjs

      - name: Run prebuild scripts
        working-directory: src
        env:
          UNIVERSAL_BUILD: "true"
        run: |
          node scripts/sync-version.cjs
          node scripts/prepare-node.cjs
          node scripts/prune-clawdbot.cjs

      - name: Verify clawdbot bundle integrity
        working-directory: src
        run: node scripts/verify-clawdbot-bundle.cjs

      - name: Enforce clawdbot duplicate gate
        working-directory: src
        run: node scripts/report-clawdbot-duplicates.cjs --enforce

      - name: Build Tauri app (universal)
        working-directory: src
        run: npm exec -- tauri build --target universal-apple-darwin
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          VITE_KN_API_SERVER: https://api.knapsack.ai
          MICROSOFT_CLIENT_ID: unused
          VITE_GOOGLE_CLIENT_ID: "963137762742-tqs7tiv9bkh80t5io8hm5q8e798ab85s.apps.googleusercontent.com"
          VITE_GOOGLE_DEVELOPER_KEY: ""
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Verify macOS bundle includes bundled UI assets
        working-directory: src
        run: |
          APP=$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: No macOS app bundle found after build."
            exit 1
          fi

          RESOURCES="$APP/Contents/Resources"
          has_main=0
          has_notification=0
          has_overlay=0
          has_recording_indicator=0

          for path in \
            "index.html" \
            "dist/index.html" \
            "_up_/dist/index.html"; do
            if [ -f "$RESOURCES/$path" ]; then
              has_main=1
              break
            fi
          done

          for path in \
            "notification.html" \
            "dist/notification.html" \
            "_up_/dist/notification.html"; do
            if [ -f "$RESOURCES/$path" ]; then
              has_notification=1
              break
            fi
          done

          for path in \
            "overlay.html" \
            "dist/overlay.html" \
            "_up_/dist/overlay.html"; do
            if [ -f "$RESOURCES/$path" ]; then
              has_overlay=1
              break
            fi
          done

          for path in \
            "recording-indicator.html" \
            "dist/recording-indicator.html" \
            "_up_/dist/recording-indicator.html"; do
            if [ -f "$RESOURCES/$path" ]; then
              has_recording_indicator=1
              break
            fi
          done

          if [ "$has_main" -ne 1 ] || [ "$has_notification" -ne 1 ] || [ "$has_overlay" -ne 1 ] || [ "$has_recording_indicator" -ne 1 ]; then
            echo "ERROR: Built app bundle is missing required UI assets in $RESOURCES."
            echo "Missing assets:"
            [ "$has_main" -eq 1 ] || echo "  - index.html"
            [ "$has_notification" -eq 1 ] || echo "  - notification.html"
            [ "$has_overlay" -eq 1 ] || echo "  - overlay.html"
            [ "$has_recording_indicator" -eq 1 ] || echo "  - recording-indicator.html"
            echo "This indicates a packaging regression. Aborting release."
            exit 1
          fi

          echo "Validated bundled UI assets are present in $APP."

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$MACOS_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm $RUNNER_TEMP/certificate.p12

          # Allow codesign to access the keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Sign and notarize
        working-directory: src
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash scripts/sign-and-notarize.sh --notarize

      - name: Verify signed app passes Gatekeeper as a user would see it
        working-directory: src
        run: |
          APP=$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -1)
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg 2>/dev/null | head -1)

          echo "=== codesign --verify (app) ==="
          codesign --verify --deep --strict --verbose=2 "$APP"

          echo "=== spctl open check (app) — mirrors Finder double-click ==="
          spctl --assess --type open --context context:primary-signature --verbose=2 "$APP"

          if [ -n "$DMG" ]; then
            echo "=== Mounting DMG and verifying .app inside ==="
            MOUNT_PT=$(mktemp -d)
            STAGE=""
            trap 'hdiutil detach "$MOUNT_PT" -quiet 2>/dev/null || true; [ -n "${STAGE:-}" ] && rm -rf "$STAGE"; rm -rf "$MOUNT_PT"' EXIT
            hdiutil attach "$DMG" -mountpoint "$MOUNT_PT" -nobrowse -readonly -quiet
            INNER_APP=$(find "$MOUNT_PT" -maxdepth 1 -name "*.app" | head -1)
            if [ -z "$INNER_APP" ]; then
              echo "ERROR: No .app found inside DMG"
              exit 1
            fi
            if [ -e "$INNER_APP/Contents/CodeResources" ]; then
              echo "ERROR: DMG app contains stray Contents/CodeResources"
              exit 1
            fi
            codesign --verify --deep --strict --verbose=2 "$INNER_APP"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$INNER_APP"
            STAGE=$(mktemp -d)
            ditto "$INNER_APP" "$STAGE/Knapsack.app"
            codesign --verify --deep --strict --verbose=2 "$STAGE/Knapsack.app"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$STAGE/Knapsack.app"
            BUNDLED_NODE=$(find "$STAGE/Knapsack.app/Contents/Resources" -path "*/node/node" -type f | head -1)
            if [ -z "$BUNDLED_NODE" ]; then
              echo "ERROR: Bundled Node.js was not found in the staged app"
              exit 1
            fi
            echo "=== Cold-starting bundled Node.js from the staged notarized app ==="
            python3 -c 'import subprocess, sys, time; started = time.monotonic(); result = subprocess.run([sys.argv[1], "--version"], check=True, capture_output=True, text=True, timeout=30); elapsed = time.monotonic() - started; print(f"Bundled Node.js {result.stdout.strip()} became ready in {elapsed:.2f}s")' "$BUNDLED_NODE"
            rm -rf "$STAGE"
            STAGE=""
            hdiutil detach "$MOUNT_PT" -quiet
            trap - EXIT
            rm -rf "$MOUNT_PT"
            echo "=== DMG mount check passed ==="
          fi

          echo "=== All Gatekeeper checks passed ==="

      - name: Recreate updater archive after signing
        working-directory: src
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: bash scripts/recreate-updater-archive.sh

      - name: Verify updater archive preserves signature after repack
        working-directory: src
        run: |
          TARBALL=$(ls src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz | head -1)
          EXTRACT_DIR=$(mktemp -d)
          tar -xzf "$TARBALL" -C "$EXTRACT_DIR"
          EXTRACTED_APP=$(find "$EXTRACT_DIR" -maxdepth 1 -name "*.app" | head -1)

          echo "=== codesign --verify (extracted updater app) ==="
          codesign --verify --deep --strict --verbose=2 "$EXTRACTED_APP"

          echo "=== spctl open check (extracted updater app) ==="
          spctl --assess --type open --context context:primary-signature --verbose=2 "$EXTRACTED_APP"

          rm -rf "$EXTRACT_DIR"
          echo "=== Updater archive signature check passed ==="

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: macos-artifacts
          path: |
            src/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows — NSIS current-user installer plus MSI compatibility artifact
  # ---------------------------------------------------------------------------
  build-windows:
    needs: bump-version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump-version.outputs.tag }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src/src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install npm dependencies
        working-directory: src
        run: npm install

      - name: Create .env from example
        working-directory: src
        run: Copy-Item .env.example .env

      - name: Cache clawdbot node_modules
        id: cache-clawdbot-nm
        uses: actions/cache@v4
        with:
          path: src/src-tauri/resources/clawdbot/node_modules
          key: clawdbot-nm-windows-${{ hashFiles('src/src-tauri/resources/clawdbot/npm-shrinkwrap.json') }}
          restore-keys: |
            clawdbot-nm-windows-

      - name: Install clawdbot dependencies
        if: steps.cache-clawdbot-nm.outputs.cache-hit != 'true'
        working-directory: src/src-tauri/resources/clawdbot
        run: npm ci --ignore-scripts

      - name: Install bundled plugin runtime deps
        working-directory: src
        run: node scripts/install-bundled-plugin-deps.cjs

      - name: Report clawdbot duplicates before prune
        working-directory: src
        run: node scripts/report-clawdbot-duplicates.cjs

      - name: Run prebuild scripts
        working-directory: src
        run: |
          node scripts/sync-version.cjs
          node scripts/prepare-node.cjs
          node scripts/prune-clawdbot.cjs

      - name: Verify bundled Node.js toolchain
        working-directory: src
        shell: pwsh
        run: |
          $nodeExe = "src-tauri\resources\node\node.exe"
          $npmCli  = "src-tauri\resources\node\node_modules\npm\bin\npm-cli.js"
          $ok = $true
          if (-not (Test-Path $nodeExe)) {
            Write-Error "MISSING: $nodeExe — run: node scripts/prepare-node.cjs"
            $ok = $false
          } else {
            $v = & ".\$nodeExe" --version 2>&1
            Write-Host "node.exe version: $v ✓"
          }
          if (-not (Test-Path $npmCli)) {
            Write-Error "MISSING: $npmCli — plugin runtime deps will fail on Windows"
            $ok = $false
          } else {
            Write-Host "npm-cli.js present ✓"
          }
          if (-not $ok) { exit 1 }

      - name: Verify clawdbot bundle integrity
        working-directory: src
        run: node scripts/verify-clawdbot-bundle.cjs

      - name: Enforce clawdbot duplicate gate
        working-directory: src
        run: node scripts/report-clawdbot-duplicates.cjs --enforce

      - name: Build frontend
        # Must run BEFORE Pack (below) — the prebuild hook calls
        # verify-clawdbot-bundle.cjs which requires node_modules to exist.
        working-directory: src
        run: npm run build
        env:
          VITE_KN_API_SERVER: https://api.knapsack.ai
          MICROSOFT_CLIENT_ID: unused
          VITE_GOOGLE_CLIENT_ID: "963137762742-tqs7tiv9bkh80t5io8hm5q8e798ab85s.apps.googleusercontent.com"
          VITE_GOOGLE_DEVELOPER_KEY: ""

      - name: Pack node_modules into tar for Windows installer
        # Run from within the clawdbot dir so tar needs no path juggling.
        # Packing node_modules into one file keeps the Windows installer input
        # small. prune-clawdbot.cjs also emits startup_node_modules.tar, a
        # compact launch-critical subset that can be extracted quickly before
        # the gateway binds.
        working-directory: src/src-tauri/resources/clawdbot
        shell: pwsh
        run: |
          if (-not (Test-Path "node_modules.tar")) {
            Write-Error "node_modules.tar missing — prune-clawdbot.cjs should create the full runtime archive"
            exit 1
          }
          if (-not (Test-Path "startup_node_modules.tar")) {
            Write-Error "startup_node_modules.tar missing — prune-clawdbot.cjs should create the launch-critical runtime archive"
            exit 1
          }
          Write-Host "Reusing node_modules.tar and startup_node_modules.tar produced by prune-clawdbot.cjs"
          $requiredEntries = @(
            "node_modules/@earendil-works/pi-agent-core/dist/index.js",
            "node_modules/@earendil-works/pi-agent-core/dist/agent.js"
          )
          $tarEntries = tar -tf node_modules.tar
          foreach ($entry in $requiredEntries) {
            if ($tarEntries -notcontains $entry) {
              Write-Error "node_modules.tar missing required runtime file: $entry"
              exit 1
            }
          }
          $startupEntries = tar -tf startup_node_modules.tar
          foreach ($entry in $requiredEntries) {
            if ($startupEntries -notcontains $entry) {
              Write-Error "startup_node_modules.tar missing required runtime file: $entry"
              exit 1
            }
          }
          $mb = [math]::Round((Get-Item node_modules.tar).Length / 1MB, 1)
          $startupMb = [math]::Round((Get-Item startup_node_modules.tar).Length / 1MB, 1)
          $n  = (Get-ChildItem -Recurse . | Measure-Object).Count
          Write-Host "node_modules.tar: $mb MB; startup_node_modules.tar: $startupMb MB. Windows installer will see $n files."

      - name: Disable beforeBuildCommand in tauri.conf.json
        # The frontend is already compiled above. Remove beforeBuildCommand so
        # Tauri doesn't re-run npm run build — after Pack, node_modules is gone
        # and the prebuild hook (verify-clawdbot-bundle.cjs) would fail.
        shell: pwsh
        run: |
          $confPath = "src/src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $conf.build.PSObject.Properties.Remove('beforeBuildCommand')
          $conf | ConvertTo-Json -Depth 20 | Set-Content $confPath -Encoding UTF8
          Write-Host "Removed beforeBuildCommand from tauri.conf.json"

      - name: Clean stale bundle artifacts and show disk space
        shell: pwsh
        run: |
          if (Test-Path "src\src-tauri\target\release\bundle") {
            Remove-Item -Recurse -Force "src\src-tauri\target\release\bundle"
            Write-Host "Cleared stale bundle artifacts"
          }
          Get-PSDrive C | Select-Object Used, Free | ForEach-Object { Write-Host "Disk: used=$([math]::Round($_.Used/1GB,1))GB free=$([math]::Round($_.Free/1GB,1))GB" }

      - name: Install AzureSignTool
        if: env.AZURE_KEY_VAULT_URI != ''
        env:
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
        run: dotnet tool install --global AzureSignTool

      - name: Configure Windows code signing (Azure Key Vault)
        if: env.AZURE_KEY_VAULT_URI != ''
        shell: pwsh
        env:
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          AZURE_KEY_VAULT_CERT_NAME: ${{ secrets.AZURE_KEY_VAULT_CERT_NAME }}
          AZURE_KEY_VAULT_CLIENT_ID: ${{ secrets.AZURE_KEY_VAULT_CLIENT_ID }}
          AZURE_KEY_VAULT_CLIENT_SECRET: ${{ secrets.AZURE_KEY_VAULT_CLIENT_SECRET }}
          AZURE_KEY_VAULT_TENANT_ID: ${{ secrets.AZURE_KEY_VAULT_TENANT_ID }}
        run: |
          # Tauri v1 splits signCommand on spaces (no shell parsing) before running it,
          # so quoted values arrive with literal " chars that break URI parsing in
          # AzureSignTool. All secret values are single tokens (no spaces), so no
          # quoting is needed. %1 is substituted with the file path by Tauri v1.
          $signCommand = "AzureSignTool sign -kvu $env:AZURE_KEY_VAULT_URI -kvc $env:AZURE_KEY_VAULT_CERT_NAME -kvi $env:AZURE_KEY_VAULT_CLIENT_ID -kvs $env:AZURE_KEY_VAULT_CLIENT_SECRET -kvt $env:AZURE_KEY_VAULT_TENANT_ID -tr http://timestamp.globalsign.com/tsa/advanced -td sha256 %1"

          $confPath = "src/src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $conf.tauri.bundle.windows | Add-Member -NotePropertyName "signCommand" -NotePropertyValue $signCommand -Force
          $conf | ConvertTo-Json -Depth 20 | Set-Content $confPath -Encoding UTF8
          Write-Host "Injected signCommand into tauri.conf.json for Tauri v1 code signing"

      - name: Diagnose AzureSignTool (dry-run before Tauri build)
        if: env.AZURE_KEY_VAULT_URI != ''
        shell: pwsh
        continue-on-error: true
        env:
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          AZURE_KEY_VAULT_CERT_NAME: ${{ secrets.AZURE_KEY_VAULT_CERT_NAME }}
          AZURE_KEY_VAULT_CLIENT_ID: ${{ secrets.AZURE_KEY_VAULT_CLIENT_ID }}
          AZURE_KEY_VAULT_CLIENT_SECRET: ${{ secrets.AZURE_KEY_VAULT_CLIENT_SECRET }}
          AZURE_KEY_VAULT_TENANT_ID: ${{ secrets.AZURE_KEY_VAULT_TENANT_ID }}
        run: |
          # Copy a small Windows binary to temp and attempt to sign it directly.
          # This surfaces AzureSignTool's real error output before Tauri swallows it.
          $testFile = "$env:TEMP\diag_sign_test.exe"
          Copy-Item "$env:SystemRoot\System32\cmd.exe" $testFile
          Write-Host "=== AzureSignTool diagnostic sign attempt ==="
          & AzureSignTool sign `
            -kvu "$env:AZURE_KEY_VAULT_URI" `
            -kvc "$env:AZURE_KEY_VAULT_CERT_NAME" `
            -kvi "$env:AZURE_KEY_VAULT_CLIENT_ID" `
            -kvs "$env:AZURE_KEY_VAULT_CLIENT_SECRET" `
            -kvt "$env:AZURE_KEY_VAULT_TENANT_ID" `
            -tr http://timestamp.globalsign.com/tsa/advanced `
            -td sha256 `
            -v `
            $testFile
          Write-Host "=== AzureSignTool exit code: $LASTEXITCODE ==="
          Remove-Item $testFile -ErrorAction SilentlyContinue

      - name: Build Tauri app
        working-directory: src
        shell: pwsh
        # NSIS current-user mode installs under LOCALAPPDATA and avoids UAC.
        # MSI is also produced because several release/QA flows expect it.
        run: |
          $log = "$env:RUNNER_TEMP\tauri-build.log"
          # The updater bundle is opt-in in Tauri v1, even when updater.active
          # is true. Without it the release still produces installers, but no
          # signed archive for latest.json.
          npx tauri build --bundles nsis,msi,updater --verbose 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          VITE_KN_API_SERVER: https://api.knapsack.ai
          MICROSOFT_CLIENT_ID: unused
          VITE_GOOGLE_CLIENT_ID: "963137762742-tqs7tiv9bkh80t5io8hm5q8e798ab85s.apps.googleusercontent.com"
          VITE_GOOGLE_DEVELOPER_KEY: ""
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Show disk space after build
        if: always()
        shell: pwsh
        run: |
          Get-PSDrive C | Select-Object Used, Free | ForEach-Object { Write-Host "Disk after build: used=$([math]::Round($_.Used/1GB,1))GB free=$([math]::Round($_.Free/1GB,1))GB" }

      - name: Verify Windows installer artifacts
        shell: pwsh
        run: |
          $verifyLog = "$env:RUNNER_TEMP\windows-installer-verify.log"
          $installers = @()
          $installers += @(Get-ChildItem 'src\src-tauri\target\release\bundle\nsis\*.exe' -ErrorAction SilentlyContinue)
          $installers += @(Get-ChildItem 'src\src-tauri\target\release\bundle\msi\*.msi' -ErrorAction SilentlyContinue)
          if ($installers.Count -eq 0) {
            Write-Error "No Windows installers were produced"
            exit 1
          }
          foreach ($installer in $installers) {
            try {
              & 'src\scripts\verify-windows-installer.ps1' -InstallerPath $installer.FullName -InstallDir "$env:RUNNER_TEMP\ks-install-qa-$($installer.BaseName)" 2>&1 |
                Tee-Object -FilePath $verifyLog -Append
            } catch {
              $_ | Tee-Object -FilePath $verifyLog -Append
              exit 1
            }
          }
          $updaterArchives = @(Get-ChildItem 'src\src-tauri\target\release\bundle\nsis\*.nsis.zip' -ErrorAction SilentlyContinue)
          if ($updaterArchives.Count -ne 1) {
            Write-Error "Expected exactly one Windows updater archive, found $($updaterArchives.Count)"
            exit 1
          }
          $updaterSignature = "$($updaterArchives[0].FullName).sig"
          if (-not (Test-Path $updaterSignature) -or (Get-Item $updaterSignature).Length -eq 0) {
            Write-Error "Windows updater signature is missing or empty: $updaterSignature"
            exit 1
          }

      - name: Post build log to PR on failure
        if: failure() && github.event.pull_request.number != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pr   = "${{ github.event.pull_request.number }}"
          $repo = "${{ github.repository }}"
          $run  = "${{ github.run_id }}"
          $log  = "$env:RUNNER_TEMP\tauri-build.log"
          $verifyLog = "$env:RUNNER_TEMP\windows-installer-verify.log"
          if (Test-Path $verifyLog) {
            $tail = (Get-Content $verifyLog -Tail 120) -join "`n"
            $body = "**[Windows CI] installer verification failed (run $run)**`n``````text`n$tail`n``````"
          } elseif (Test-Path $log) {
            $tail = (Get-Content $log -Tail 100) -join "`n"
            $body = "**[Windows CI] build-windows failed (run $run)**`n``````text`n$tail`n``````"
          } else {
            $body = "**[Windows CI] build-windows failed before Build step (run $run). No build log captured.**"
          }
          gh pr comment $pr --body $body --repo $repo

      - name: Upload Tauri build log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: tauri-build-log
          path: |
            ${{ runner.temp }}/tauri-build.log
            ${{ runner.temp }}/windows-installer-verify.log
          if-no-files-found: ignore

      - name: Upload Windows artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-artifacts
          path: |
            src/src-tauri/target/release/bundle/nsis/*.exe
            src/src-tauri/target/release/bundle/nsis/*.nsis.zip
            src/src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
            src/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Create GitHub Release with all artifacts + latest.json for auto-updater
  # ---------------------------------------------------------------------------
  publish-release:
    needs: [bump-version, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Generate latest.json for Tauri auto-updater
        env:
          TAG: ${{ needs.bump-version.outputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/$TAG"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Read signature files
          MACOS_SIG=""
          MACOS_TAR_NAME=""
          for f in artifacts/macos-artifacts/**/*.app.tar.gz.sig artifacts/macos-artifacts/*.app.tar.gz.sig; do
            if [ -f "$f" ]; then
              MACOS_SIG=$(cat "$f")
              MACOS_TAR_NAME=$(basename "${f%.sig}")
              break
            fi
          done

          WIN_SIG=""
          WIN_ZIP_NAME=""
          for f in artifacts/windows-artifacts/**/*.nsis.zip.sig artifacts/windows-artifacts/*.nsis.zip.sig; do
            if [ -f "$f" ]; then
              WIN_SIG=$(cat "$f")
              WIN_ZIP_NAME=$(basename "${f%.sig}")
              break
            fi
          done

          WIN_SETUP_NAME=""
          for f in artifacts/windows-artifacts/**/*.msi artifacts/windows-artifacts/*.msi; do
            if [ -f "$f" ]; then
              WIN_SETUP_NAME=$(basename "$f")
              break
            fi
          done

          if [ -z "$MACOS_TAR_NAME" ] || [ -z "$MACOS_SIG" ]; then
            echo "Missing signed macOS updater artifact" >&2
            exit 1
          fi
          if [ -z "$WIN_ZIP_NAME" ] || [ -z "$WIN_SIG" ]; then
            echo "Missing signed Windows updater artifact" >&2
            exit 1
          fi
          if [ -z "$WIN_SETUP_NAME" ]; then
            echo "Missing Windows MSI installer" >&2
            exit 1
          fi

          # Build latest.json
          cat > artifacts/latest.json <<EOF
          {
            "version": "$TAG",
            "notes": "Knapsack $TAG",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "darwin-x86_64": {
                "url": "$RELEASE_URL/$MACOS_TAR_NAME",
                "signature": "$MACOS_SIG"
              },
              "darwin-aarch64": {
                "url": "$RELEASE_URL/$MACOS_TAR_NAME",
                "signature": "$MACOS_SIG"
              },
              "windows-x86_64": {
                "url": "$RELEASE_URL/$WIN_ZIP_NAME",
                "signature": "$WIN_SIG",
                "setupUrl": "$RELEASE_URL/$WIN_SETUP_NAME"
              }
            }
          }
          EOF

          echo "[release] Generated latest.json:"
          cat artifacts/latest.json

      - name: Collect release files
        run: |
          mkdir -p release-files
          # macOS
          find artifacts/macos-artifacts -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \) -exec cp {} release-files/ \;
          # Windows
          find artifacts/windows-artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.nsis.zip" -o -name "*.nsis.zip.sig" \) -exec cp {} release-files/ \;
          # Updater metadata
          cp artifacts/latest.json release-files/
          echo "[release] Files to upload:"
          ls -lh release-files/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.bump-version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            release-files/* 2>/dev/null \
          || gh release upload "$TAG" release-files/* --clobber
