name: Build Windows App

on:
  push:
    branches: [main, "release/*", "claude/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src/src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install npm dependencies
        working-directory: src
        run: npm install

      - name: Create .env from example
        working-directory: src
        run: Copy-Item .env.example .env

      - name: Run prebuild scripts
        working-directory: src
        run: |
          node scripts/sync-version.cjs
          node scripts/prepare-node.cjs
          node scripts/prune-clawdbot.cjs

      - name: Clean Tauri NSIS cache and stale bundle artifacts
        run: |
          if (Test-Path "$env:LOCALAPPDATA\tauri\NSIS") {
            Remove-Item -Recurse -Force "$env:LOCALAPPDATA\tauri\NSIS"
            Write-Host "Cleared stale NSIS toolchain cache"
          }
          if (Test-Path "src\src-tauri\target\release\bundle") {
            Remove-Item -Recurse -Force "src\src-tauri\target\release\bundle"
            Write-Host "Cleared stale bundle artifacts"
          }

      - name: Generate temporary updater signing key (CI only)
        shell: pwsh
        run: |
          npx tauri signer generate -w "$env:RUNNER_TEMP\ci-key.key"
          $privkey = (Get-Content "$env:RUNNER_TEMP\ci-key.key" -Raw).Trim()
          $delim = "EOF_$(Get-Random)"
          echo "TAURI_PRIVATE_KEY<<$delim" >> $env:GITHUB_ENV
          echo "$privkey" >> $env:GITHUB_ENV
          echo "$delim" >> $env:GITHUB_ENV
          echo "TAURI_KEY_PASSWORD=" >> $env:GITHUB_ENV
        working-directory: src

      - name: Build Tauri app
        working-directory: src
        run: npx tauri build
        env:
          VITE_KN_API_SERVER: https://api.knapsack.ai
          MICROSOFT_CLIENT_ID: unused
          VITE_GOOGLE_CLIENT_ID: ""
          VITE_GOOGLE_DEVELOPER_KEY: ""

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v5
        with:
          name: knapsack-windows-msi
          path: src/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v5
        with:
          name: knapsack-windows-nsis
          path: src/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
