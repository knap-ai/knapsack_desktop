name: Build Windows App

on:
  push:
    branches: [main, "release/*", "claude/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src/src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install npm dependencies
        working-directory: src
        run: npm install

      - name: Create .env from example
        working-directory: src
        run: Copy-Item .env.example .env

      - name: Install clawdbot dependencies
        working-directory: src/src-tauri/resources/clawdbot
        run: npm ci --ignore-scripts

      - name: Install bundled plugin runtime deps
        working-directory: src
        run: node scripts/install-bundled-plugin-deps.cjs

      - name: Run prebuild scripts
        working-directory: src
        run: |
          node scripts/sync-version.cjs
          node scripts/prepare-node.cjs
          node scripts/prune-clawdbot.cjs

      - name: Verify clawdbot bundle integrity
        working-directory: src
        run: node scripts/verify-clawdbot-bundle.cjs

      - name: Pack node_modules into tarball for NSIS
        shell: pwsh
        run: |
          # NSIS fails with ~13k individual node_modules files.
          # Use tar.exe (built into Windows Server 2019+) — handles long paths
          # reliably unlike Compress-Archive which hits MAX_PATH at 260 chars.
          # The Rust service layer extracts the tarball on first launch.
          $clawdbot = "src\src-tauri\resources\clawdbot"
          Write-Host "Creating node_modules.tar.gz via tar.exe ..."
          tar -czf "$clawdbot\node_modules.tar.gz" -C $clawdbot node_modules
          if ($LASTEXITCODE -ne 0) { Write-Error "tar failed"; exit 1 }
          Remove-Item -Recurse -Force "$clawdbot\node_modules"
          $mb = [math]::Round((Get-Item "$clawdbot\node_modules.tar.gz").Length / 1MB, 1)
          Write-Host "Created node_modules.tar.gz ($mb MB); node_modules directory removed."

      - name: Clean stale bundle artifacts and show disk space
        shell: pwsh
        run: |
          if (Test-Path "src\src-tauri\target\release\bundle") {
            Remove-Item -Recurse -Force "src\src-tauri\target\release\bundle"
            Write-Host "Cleared stale bundle artifacts"
          }
          Get-PSDrive C | Select-Object Used, Free | ForEach-Object { Write-Host "Disk: used=$([math]::Round($_.Used/1GB,1))GB free=$([math]::Round($_.Free/1GB,1))GB" }

      - name: Install AzureSignTool
        if: env.AZURE_KEY_VAULT_URI != ''
        env:
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
        run: dotnet tool install --global AzureSignTool

      - name: Configure Windows code signing (Azure Key Vault)
        if: env.AZURE_KEY_VAULT_URI != ''
        shell: pwsh
        env:
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          AZURE_KEY_VAULT_CERT_NAME: ${{ secrets.AZURE_KEY_VAULT_CERT_NAME }}
          AZURE_KEY_VAULT_CLIENT_ID: ${{ secrets.AZURE_KEY_VAULT_CLIENT_ID }}
          AZURE_KEY_VAULT_CLIENT_SECRET: ${{ secrets.AZURE_KEY_VAULT_CLIENT_SECRET }}
          AZURE_KEY_VAULT_TENANT_ID: ${{ secrets.AZURE_KEY_VAULT_TENANT_ID }}
        run: |
          # Tauri v1 reads signCommand from tauri.conf.json (NOT from
          # TAURI_WINDOWS_SIGN_COMMAND env var — that's a Tauri v2 feature).
          # Inject the signCommand into the config before building.
          $signCommand = "AzureSignTool sign -kvu `"$env:AZURE_KEY_VAULT_URI`" -kvc `"$env:AZURE_KEY_VAULT_CERT_NAME`" -kvi `"$env:AZURE_KEY_VAULT_CLIENT_ID`" -kvs `"$env:AZURE_KEY_VAULT_CLIENT_SECRET`" -kvt `"$env:AZURE_KEY_VAULT_TENANT_ID`" -tr http://timestamp.globalsign.com/tsa/advanced -td sha256 `"%1`""

          $confPath = "src/src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $conf.tauri.bundle.windows | Add-Member -NotePropertyName "signCommand" -NotePropertyValue $signCommand -Force
          $conf | ConvertTo-Json -Depth 20 | Set-Content $confPath -Encoding UTF8
          Write-Host "Injected signCommand into tauri.conf.json for Tauri v1 code signing"

      - name: Build Tauri app
        working-directory: src
        run: npx tauri build --bundles nsis
        env:
          VITE_KN_API_SERVER: https://api.knapsack.ai
          MICROSOFT_CLIENT_ID: unused
          VITE_GOOGLE_CLIENT_ID: "963137762742-tqs7tiv9bkh80t5io8hm5q8e798ab85s.apps.googleusercontent.com"
          VITE_GOOGLE_DEVELOPER_KEY: ""
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

      - name: Build web installer stub
        shell: pwsh
        run: |
          # Windows-2022 runners ship NSIS; use it to compile the stub.
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            Write-Error "NSIS not found at $makensis"; exit 1
          }
          & $makensis /V3 src\installer\stub.nsi
          if ($LASTEXITCODE -ne 0) { Write-Error "makensis failed"; exit 1 }
          Write-Host "Built: src\installer\Knapsack-web-setup.exe"

      - name: Sign web installer stub
        if: env.AZURE_KEY_VAULT_URI != ''
        shell: pwsh
        env:
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          AZURE_KEY_VAULT_CERT_NAME: ${{ secrets.AZURE_KEY_VAULT_CERT_NAME }}
          AZURE_KEY_VAULT_CLIENT_ID: ${{ secrets.AZURE_KEY_VAULT_CLIENT_ID }}
          AZURE_KEY_VAULT_CLIENT_SECRET: ${{ secrets.AZURE_KEY_VAULT_CLIENT_SECRET }}
          AZURE_KEY_VAULT_TENANT_ID: ${{ secrets.AZURE_KEY_VAULT_TENANT_ID }}
        run: |
          AzureSignTool sign `
            -kvu "$env:AZURE_KEY_VAULT_URI" `
            -kvc "$env:AZURE_KEY_VAULT_CERT_NAME" `
            -kvi "$env:AZURE_KEY_VAULT_CLIENT_ID" `
            -kvs "$env:AZURE_KEY_VAULT_CLIENT_SECRET" `
            -kvt "$env:AZURE_KEY_VAULT_TENANT_ID" `
            -tr http://timestamp.globalsign.com/tsa/advanced `
            -td sha256 `
            src\installer\Knapsack-web-setup.exe
          Write-Host "Signed: Knapsack-web-setup.exe"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v5
        with:
          name: knapsack-windows-msi
          path: src/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v5
        with:
          name: knapsack-windows-nsis
          path: src/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload web installer stub artifact
        uses: actions/upload-artifact@v5
        with:
          name: knapsack-windows-web-setup
          path: src/installer/Knapsack-web-setup.exe
          if-no-files-found: warn
