name: Refresh Public Provider Models

on:
  schedule:
    - cron: '17 15 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-public-provider-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Refresh public provider model catalogs
        working-directory: src
        run: npm run models:refresh:public

      - name: Create pull request if catalog changed
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.MODEL_CATALOG_REFRESH_TOKEN }}
          commit-message: 'Refresh public provider model catalogs'
          title: 'Refresh public provider model catalogs'
          body: |
            Weekly refresh of shared public-provider model catalogs, including Google Gemini, from official public docs and APIs.

            This updates the model choices shown in Knapsack provider settings and chat model pickers.
          branch: codex/refresh-public-provider-model-catalogs
          delete-branch: true
